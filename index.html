<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xenon Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap');

        :root {
            --bg: #050505;
            --card: #121212;
            --border: #2a2a2a;
            --accent: #6d28d9; /* Фиолетовый акцент */
            --text: #ffffff;
            --gray: #888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            /* Легкий фоновый градиент */
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #050505 50%);
            min-height: 100vh;
        }

        .container { padding: 16px; padding-bottom: 100px; }

        /* HEADER & PROFILE */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; backdrop-filter: blur(10px);
        }
        .user-box { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #4c1d95);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-family: 'Rajdhani', sans-serif; font-size: 18px;
        }
        .user-meta div:first-child { font-weight: 600; font-size: 14px; }
        .user-meta div:last-child { font-size: 11px; color: var(--gray); font-family: monospace; }
        
        .server-status { text-align: right; }
        .ping { color: #10b981; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
        .ping::before { content: ''; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
        .status-text { font-size: 10px; color: var(--gray); text-transform: uppercase; }

        /* HERO */
        .hero { text-align: center; margin: 30px 0; }
        .hero h1 {
            font-family: 'Rajdhani', sans-serif; font-size: 36px; margin: 0;
            text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--gray); font-size: 13px; margin-top: 5px; }

        /* TABS */
        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .tab {
            background: var(--card); border: 1px solid var(--border);
            padding: 8px 24px; border-radius: 8px; font-size: 12px; color: var(--gray);
            cursor: pointer; transition: 0.3s;
        }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px rgba(109, 40, 217, 0.4); }

        /* GRID */
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; } /* Одна колонка для больших карточек */
        
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; position: relative;
            transition: 0.3s;
        }
        .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        
        .card-img {
            width: 100%; height: 160px; /* Картинка побольше */
            object-fit: cover; border-bottom: 1px solid var(--border);
            background: #000;
        }
        
        .card-body { padding: 16px; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card-title { font-weight: 700; font-size: 18px; color: #fff; }
        .card-desc { font-size: 12px; color: var(--gray); line-height: 1.5; margin-bottom: 15px; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .price { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 22px; color: #fff; }
        
        .add-btn {
            padding: 8px 16px; background: #2a2a2a; border-radius: 8px;
            font-size: 14px; color: white; transition: 0.2s; font-weight: 600;
        }
        .card.selected .add-btn { background: var(--accent); }

        /* Бейджик платформы */
        .platform-badge {
            font-size: 10px; padding: 4px 8px; border-radius: 4px;
            background: rgba(255,255,255,0.1); color: #ccc; font-weight: 600;
            text-transform: uppercase;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="user-box">
                <div class="avatar" id="avatar">X</div>
                <div class="user-meta">
                    <div id="username">Guest</div>
                    <div id="userid">Loading ID...</div>
                </div>
            </div>
            <div class="server-status">
                <div class="ping">18ms</div>
                <div class="status-text">Servers Online</div>
            </div>
        </div>

        <div class="hero">
            <h1>XENON STORE</h1>
            <p>Premium Undetected Software</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="filter('all', this)">ALL</div>
            <div class="tab" onclick="filter('android', this)">ANDROID</div>
            <div class="tab" onclick="filter('ios', this)">iOS</div>
        </div>

        <div class="grid" id="grid"></div>

    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // Профиль
    const user = tg.initDataUnsafe.user;
    if (user) {
        document.getElementById('username').innerText = user.first_name;
        document.getElementById('userid').innerText = `ID: ${user.id}`;
        document.getElementById('avatar').innerText = user.first_name[0].toUpperCase();
    }

    // --- ТВОИ ДВА ТОВАРА ---
    // Убедись, что картинки называются точно так же и лежат в корне!
    const products = [
        { 
            id: 1, 
            type: 'android', 
            name: 'Xenon Android', 
            price: 450, 
            desc: 'Мощный функционал без рут прав. Legit & Rage настройки. Полный Undetected 2026.',
            img: 'noroot.png', // Твоя картинка
            badge: 'NO ROOT'
        },
        { 
            id: 2, 
            type: 'ios', 
            name: 'Xenon iOS', 
            price: 1200, 
            desc: 'Приватная версия для iPhone/iPad. Работает без Jailbreak. Сертификат в комплекте.',
            img: 'ios.png', // Твоя картинка
            badge: 'NO JAIL'
        }
    ];

    let selected = null;

    function render(filterType) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        products.forEach(p => {
            if (filterType === 'all' || p.type === filterType) {
                const isSel = selected === p.id;
                const div = document.createElement('div');
                div.className = `card ${isSel ? 'selected' : ''}`;
                div.onclick = () => select(p);
                
                div.innerHTML = `
                    <img src="${p.img}" class="card-img" alt="${p.name}">
                    <div class="card-body">
                        <div class="card-top">
                            <div class="platform-badge">${p.badge}</div>
                        </div>
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                        <div class="card-footer">
                            <div class="price">${p.price}₽</div>
                            <div class="add-btn">${isSel ? 'ВЫБРАНО' : 'ВЫБРАТЬ'}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            }
        });
    }

    function select(p) {
        tg.HapticFeedback.impactOccurred('medium');
        if (selected === p.id) {
            selected = null;
            tg.MainButton.hide();
        } else {
            selected = p.id;
            tg.MainButton.text = `КУПИТЬ ${p.name.toUpperCase()} — ${p.price}₽`;
            tg.MainButton.color = "#6d28d9";
            tg.MainButton.textColor = "#fff";
            tg.MainButton.show();
        }
        // Обновляем отображение кнопок
        const currentFilter = document.querySelector('.tab.active').innerText.toLowerCase();
        render(currentFilter); 
    }

    window.filter = (type, btn) => {
        tg.HapticFeedback.selectionChanged();
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        render(type);
    }

    tg.MainButton.onClick(() => {
        const p = products.find(x => x.id === selected);
        tg.sendData(JSON.stringify(p));
    });

    // Запуск
    render('all');

</script>
</body>
</html>
