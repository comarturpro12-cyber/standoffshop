<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vesper Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap');

        :root {
            --bg: #050505;
            --card: #121212;
            --border: #2a2a2a;
            --accent: #6d28d9; /* Deep Purple */
            --text: #ffffff;
            --gray: #888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .container { padding: 16px; padding-bottom: 100px; }

        /* HEADER & PROFILE */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; backdrop-filter: blur(10px);
        }
        .user-box { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #4c1d95);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-family: 'Rajdhani', sans-serif; font-size: 18px;
        }
        .user-meta div:first-child { font-weight: 600; font-size: 14px; }
        .user-meta div:last-child { font-size: 11px; color: var(--gray); font-family: monospace; }
        
        .server-status { text-align: right; }
        .ping { color: #10b981; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
        .ping::before { content: ''; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
        .status-text { font-size: 10px; color: var(--gray); text-transform: uppercase; }

        /* HERO */
        .hero { text-align: center; margin: 30px 0; }
        .hero h1 {
            font-family: 'Rajdhani', sans-serif; font-size: 32px; margin: 0;
            text-transform: uppercase; letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--gray); font-size: 12px; margin-top: 5px; }

        /* TABS */
        .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .tab {
            background: var(--card); border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 8px; font-size: 12px; color: var(--gray);
            white-space: nowrap; transition: 0.3s;
        }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px rgba(109, 40, 217, 0.4); }

        /* GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; overflow: hidden; position: relative;
            transition: 0.3s; display: flex; flex-direction: column;
        }
        .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
        
        /* Image Placeholder */
        .card-img {
            width: 100%; height: 100px; background: #1a1a1a;
            object-fit: cover; border-bottom: 1px solid var(--border);
        }
        
        .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .card-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .card-desc { font-size: 10px; color: var(--gray); line-height: 1.4; margin-bottom: 8px; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 18px; color: #fff; }
        
        .add-btn {
            width: 28px; height: 28px; background: #2a2a2a; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: white; transition: 0.2s;
        }
        .card.selected .add-btn { background: var(--accent); }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="user-box">
                <div class="avatar" id="avatar">?</div>
                <div class="user-meta">
                    <div id="username">Guest</div>
                    <div id="userid">ID: ...</div>
                </div>
            </div>
            <div class="server-status">
                <div class="ping">24ms</div>
                <div class="status-text">Server Online</div>
            </div>
        </div>

        <div class="hero">
            <h1>VESPER MARKET</h1>
            <p>Undetected Software Solutions 2026</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="filter('all', this)">ALL</div>
            <div class="tab" onclick="filter('android', this)">ANDROID</div>
            <div class="tab" onclick="filter('ios', this)">iOS</div>
            <div class="tab" onclick="filter('pc', this)">PC</div>
        </div>

        <div class="grid" id="grid"></div>

    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 1. ЛОГИКА ПРОФИЛЯ (Теперь работает четко)
    tg.ready(); // Сообщаем телеге что мы готовы
    const user = tg.initDataUnsafe.user;

    if (user) {
        document.getElementById('username').innerText = user.first_name;
        document.getElementById('userid').innerText = `ID: ${user.id}`;
        document.getElementById('avatar').innerText = user.first_name[0].toUpperCase();
    }

    // 2. ТОВАРЫ С КАРТИНКАМИ
    // Замени ссылки в 'img' на свои! (ПКМ по картинке в интернете -> Копировать адрес)
    const products = [
        { 
            id: 1, type: 'android', name: 'Legit V3', price: 450, 
            desc: 'Aimbot, ESP, Anti-Ban System. Безопасно для основы.',
            img: 'https://i.pinimg.com/736x/8a/a0/03/8aa003920953154884f3df9348259695.jpg' 
        },
        { 
            id: 2, type: 'android', name: 'Rage King', price: 890, 
            desc: 'Spinbot, KillAura, Fast Defuse. Буст ранга.',
            img: 'https://i.pinimg.com/736x/21/96/11/2196112c2954848d34346e492163b782.jpg'
        },
        { 
            id: 3, type: 'ios', name: 'iOS Private', price: 1200, 
            desc: 'No Jailbreak. Сертификат разработчика.',
            img: 'https://wallpapers.com/images/hd/standoff-2-4k-gaming-background-j066319803366038.jpg'
        },
        { 
            id: 4, type: 'pc', name: 'Emulator God', price: 650, 
            desc: 'Bypass LDPlayer/BlueStacks. Мышь и клава.',
            img: 'https://i.pinimg.com/736x/0d/18/85/0d1885f670606016666870d890045166.jpg'
        },
        { 
            id: 5, type: 'all', name: 'Gold Pass', price: 2500, 
            desc: 'Доступ ко всему софту навсегда + Спуфер.',
            img: 'https://c4.wallpaperflare.com/wallpaper/352/240/414/standoff-2-game-poster-wallpaper-preview.jpg'
        }
    ];

    let selected = null;

    function render(type) {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        products.forEach(p => {
            if (type === 'all' || p.type === type) {
                const isSel = selected === p.id;
                const div = document.createElement('div');
                div.className = `card ${isSel ? 'selected' : ''}`;
                div.onclick = () => select(p);
                div.innerHTML = `
                    <img src="${p.img}" class="card-img">
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                        <div class="card-footer">
                            <div class="price">${p.price}₽</div>
                            <div class="add-btn">${isSel ? '✓' : '+'}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            }
        });
    }

    function select(p) {
        tg.HapticFeedback.impactOccurred('light');
        if (selected === p.id) {
            selected = null;
            tg.MainButton.hide();
        } else {
            selected = p.id;
            tg.MainButton.text = `КУПИТЬ ЗА ${p.price}₽`;
            tg.MainButton.color = "#6d28d9";
            tg.MainButton.textColor = "#fff";
            tg.MainButton.show();
        }
        render(document.querySelector('.tab.active').getAttribute('onclick').match(/'(.*?)'/)[1]);
    }

    window.filter = (t, btn) => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        render(t);
    }

    tg.MainButton.onClick(() => {
        const p = products.find(x => x.id === selected);
        tg.sendData(JSON.stringify(p));
    });

    render('all');

</script>
</body>
</html>
