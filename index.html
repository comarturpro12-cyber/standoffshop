<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #3b82f6; /* Синий цвет */
            margin: 20px 0;
        }

        .desc {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: left;
        }

        .btn {
            background: #3b82f6; /* Синяя кнопка */
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">Xenon Private V2</div>
        <div style="color: #3b82f6; font-size: 14px; margin-bottom: 15px;">Standoff 2</div>
        
        <div class="desc">
            ✅ <b>Legit Aimbot</b> (Плавная наводка)<br>
            ✅ <b>Wallhack / ESP</b> (Видно сквозь стены)<br>
            ✅ <b>SkinChanger</b> (Все скины)<br>
            ✅ <b>Anti-Ban</b> (Защита аккаунта)
        </div>

        <div class="price">450₽</div>

        <button class="btn" onclick="buyStandoff()">КУПИТЬ ДОСТУП</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 

    function buyStandoff() {
        // Вибрация
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        // Отправка данных
        tg.sendData(JSON.stringify({
            name: "Xenon Private Standoff",
            price: 450
        }));

        // ЗАКРЫТИЕ ОКНА (Важно!)
        tg.close();
    }
</script>

</body>
</html>
