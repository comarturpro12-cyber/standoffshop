<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xenon Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap');
        :root { --bg: #050505; --card: #0f0f11; --border: #27272a; --accent: #3b82f6; --text: #ffffff; --gray: #9ca3af; }
        
        @keyframes rgb-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .rgb-text { background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff); background-size: 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgb-flow 3s linear infinite; font-weight: 800; text-transform: uppercase; }
        
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; background-image: radial-gradient(circle at 50% -20%, #0f172a 0%, #000000 70%); }
        .container { padding: 16px; padding-bottom: 80px; }
        
        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; backdrop-filter: blur(10px); }
        .user-box { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3); background-size: 400% 400%; animation: rgb-flow 8s ease infinite; display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: 'Rajdhani', sans-serif; font-size: 18px; color: #fff; text-transform: uppercase; }
        .user-meta div:first-child { font-weight: 600; font-size: 14px; } .user-meta div:last-child { font-size: 11px; color: var(--gray); }
        
        /* КНОПКА НАЗАД */
        #back-btn { display: none; font-size: 24px; cursor: pointer; color: var(--accent); margin-right: 10px; transition: 0.2s; }
        #back-btn:active { transform: scale(0.8); }

        .hero { text-align: center; margin: 25px 0; transition: 0.3s; }
        .hero h1 { font-family: 'Rajdhani', sans-serif; font-size: 44px; margin: 0; text-transform: uppercase; letter-spacing: 3px; background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); background-size: 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgb-flow 5s linear infinite; }
        .hero p { color: var(--gray); font-size: 13px; margin-top: 5px; }

        /* ВКЛАДКИ (NAV-TABS) */
        .nav-tabs { display: flex; background: var(--card); border-radius: 12px; padding: 4px; margin-bottom: 25px; border: 1px solid var(--border); }
        .nav-tab { flex: 1; text-align: center; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 8px; color: var(--gray); cursor: pointer; transition: 0.3s; }
        
        /* Активная вкладка (МАГАЗИН) */
        .nav-tab.active { background: linear-gradient(90deg, #3b82f6, #8b5cf6); color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }

        /* ЭКРАНЫ */
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }

        /* КАРТОЧКИ (Главная) */
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; position: relative; transition: 0.3s; }
        .card:active { transform: scale(0.98); }
        .card-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--border); background: #000; }
        .card-body { padding: 16px; }
        .card-title { font-weight: 700; font-size: 18px; color: #fff; margin-bottom: 5px; }
        .card-desc { font-size: 12px; color: var(--gray); line-height: 1.5; margin-bottom: 15px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .go-btn { padding: 10px 20px; background: rgba(59, 130, 246, 0.1); border: 1px solid var(--accent); border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
        .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; border: 1px solid var(--border); }

        /* ДЕТАЛЬНАЯ СТРАНИЦА */
        .detail-img { width: 100%; height: 200px; object-fit: cover; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .detail-title { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 15px; text-transform: uppercase; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
        
        .detail-desc { 
            font-size: 13px; color: #d1d5db; line-height: 1.6; margin-bottom: 20px; 
            background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; 
            border: 1px solid var(--border); 
        }
        .detail-desc b { color: #fff; }

        /* ЗАГОЛОВКИ СЕКЦИЙ */
        .section-title { font-size: 12px; color: var(--gray); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; letter-spacing: 1px; margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* ФУНКЦИОНАЛ */
        .features-list { margin-bottom: 10px; }
        .feature-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: #9ca3af; }
        .feature-icon { color: var(--accent); font-weight: bold; font-size: 16px; }

        /* ТАРИФЫ */
        .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .plan-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .plan-card.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.15); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); transform: scale(1.02); }
        .plan-duration { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .plan-price { font-size: 16px; font-family: 'Rajdhani', sans-serif; color: var(--accent); font-weight: 800; }
        .full-width { grid-column: span 2; }
        .rgb-border { animation: border-rgb 3s linear infinite; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="user-box">
                <div id="back-btn" onclick="goBack()">‹</div>
                <div class="avatar" id="avatar">X</div>
                <div class="user-meta">
                    <div id="username">Guest</div>
                    <div id="userid">Loading...</div>
                </div>
            </div>
            <div style="text-align: right;">
                <div style="color:#10b981; font-size:12px; font-weight:bold;">● Online</div>
                <div style="font-size:10px; color:#666;">Xenon Server</div>
            </div>
        </div>

        <div id="main-hero" class="hero">
            <h1>XENON</h1>
            <p>Premium Undetected Software</p>
        </div>

        <div id="shop-view" class="view active">
            <div class="nav-tabs">
                <div class="nav-tab active">МАГАЗИН</div>
                </div>
            <div class="grid" id="products-grid"></div>
        </div>

        <div id="detail-view" class="view">
            <img id="d-img" src="" class="detail-img">
            <div id="d-title" class="detail-title"></div>
            
            <div id="d-desc" class="detail-desc"></div>
            
            <div class="section-title">ФУНКЦИОНАЛ</div>
            <div id="d-features" class="features-list"></div>

            <div class="section-title">ВЫБЕРИТЕ СРОК ПОДПИСКИ</div>
            <div class="plans-grid" id="plans-grid"></div>
        </div>

    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ПРОФИЛЬ
    function initProfile() {
        const urlParams = new URLSearchParams(window.location.search);
        const nameFromUrl = urlParams.get('name');
        const uidFromUrl = urlParams.get('uid');

        if (nameFromUrl) {
            document.getElementById('username').innerText = nameFromUrl;
            document.getElementById('userid').innerText = `ID: ${uidFromUrl}`;
            document.getElementById('avatar').innerText = nameFromUrl[0].toUpperCase();
        } else {
            const user = tg.initDataUnsafe.user;
            if (user) {
                document.getElementById('username').innerText = user.first_name;
                document.getElementById('userid').innerText = `ID: ${user.id}`;
                document.getElementById('avatar').innerText = user.first_name[0].toUpperCase();
            }
        }
    }
    initProfile();

    // --- БАЗА ТОВАРОВ ---
    const products = [
        { 
            id: 'android', 
            name: 'Xenon Android No Root', 
            badge: 'NO ROOT',
            img: 'noroot.png',
            short_desc: 'Legit & Rage настройки. Полный Undetected 2026.',
            // ТВОЕ ПРОДАЮЩЕЕ ОПИСАНИЕ
            full_desc: `
                Лучший чит, работающий на <b>низкоуровневых драйверах</b>, что позволяет играть <b>БЕЗ РУТ ПРАВ</b>.
                <br><br>
                🚀 <b>После оплаты вы получите:</b>
                <br>• Индивидуальный ключ активации
                <br>• Видео-гайд по установке и запуску
                <br>• Доступ в VIP-чат с пользователями
                <br>• Помощь модераторов 24/7 с любыми вопросами
            `,
            features: [
                "Aimbot (Legit / Rage / Silent)",
                "ESP / Wallhack (Box, Line, Skeleton)",
                "SkinChanger (Все скины, ножи, перчатки)",
                "Radar Hack",
                "No Recoil / No Spread",
                "Flash & Smoke Remove"
            ],
            plans: [
                { label: '7 Дней', price: 150 },
                { label: '14 Дней', price: 250 },
                { label: '30 Дней', price: 450 },
                { label: '90 Дней', price: 1100 },
                { label: 'НАВСЕГДА', price: 2500, special: true }
            ]
        },
        { 
            id: 'ios', 
            name: 'Xenon iOS Private', 
            badge: 'NO JAIL',
            img: 'ios.png',
            short_desc: 'Приватная версия для iPhone/iPad. Без Jailbreak.',
            full_desc: `
                Приватный софт для iOS устройств. Установка через TestFlight или прямым IPA файлом. 
                <br><br>
                💎 <b>Преимущества:</b>
                <br>• Полная безопасность (Undetected)
                <br>• Не требует Jailbreak
                <br>• Обход записи экрана (Stream Proof)
                <br>• Индивидуальный сертификат в комплекте
            `,
            features: [
                "Silent Aim (Magic Bullet)",
                "ESP Skeleton & Box",
                "Visible Check",
                "Stream Proof (Скрыт на записи)",
                "Auto Fire / Triggerbot"
            ],
            plans: [
                { label: '30 Дней', price: 1200 },
                { label: 'НАВСЕГДА', price: 4500, special: true }
            ]
        }
    ];

    let currentProduct = null;
    let selectedPlan = null;

    // РЕНДЕР
    function renderShop() {
        const grid = document.getElementById('products-grid');
        grid.innerHTML = '';
        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="badge">${p.badge}</div>
                <img src="${p.img}" class="card-img">
                <div class="card-body">
                    <div class="card-title">${p.name}</div>
                    <div class="card-desc">${p.short_desc}</div>
                    <div class="card-footer">
                        <div style="font-size:12px; color:#666;">От ${p.plans[0].price}₽</div>
                        <div class="go-btn" onclick="openDetail('${p.id}')">ПЕРЕЙТИ ➔</div>
                    </div>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function openDetail(id) {
        currentProduct = products.find(x => x.id === id);
        selectedPlan = null;
        tg.MainButton.hide();

        document.getElementById('d-img').src = currentProduct.img;
        document.getElementById('d-title').innerText = currentProduct.name;
        document.getElementById('d-desc').innerHTML = currentProduct.full_desc;

        // ФУНКЦИОНАЛ
        const featureContainer = document.getElementById('d-features');
        featureContainer.innerHTML = '';
        currentProduct.features.forEach(feat => {
            const el = document.createElement('div');
            el.className = 'feature-item';
            el.innerHTML = `<span class="feature-icon">✓</span> ${feat}`;
            featureContainer.appendChild(el);
        });

        // ТАРИФЫ
        const plansContainer = document.getElementById('plans-grid');
        plansContainer.innerHTML = '';
        currentProduct.plans.forEach((plan, index) => {
            const btn = document.createElement('div');
            btn.className = `plan-card ${plan.special ? 'full-width rgb-border' : ''}`;
            btn.onclick = () => selectPlan(index);
            btn.id = `plan-${index}`;
            btn.innerHTML = `
                <div class="plan-duration">${plan.label}</div>
                <div class="plan-price">${plan.price}₽</div>
            `;
            plansContainer.appendChild(btn);
        });

        document.getElementById('shop-view').classList.remove('active');
        document.getElementById('detail-view').classList.add('active');
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('main-hero').style.display = 'none';
        window.scrollTo(0, 0);
    }

    function selectPlan(index) {
        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        
        document.querySelectorAll('.plan-card').forEach(el => el.classList.remove('active'));
        document.getElementById(`plan-${index}`).classList.add('active');

        selectedPlan = currentProduct.plans[index];

        tg.MainButton.text = `КУПИТЬ ЗА ${selectedPlan.price}₽`;
        tg.MainButton.color = "#3b82f6";
        tg.MainButton.textColor = "#fff";
        tg.MainButton.show();
    }

    window.goBack = function() {
        if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        document.getElementById('detail-view').classList.remove('active');
        document.getElementById('shop-view').classList.add('active');
        document.getElementById('back-btn').style.display = 'none';
        document.getElementById('main-hero').style.display = 'block';
        tg.MainButton.hide();
        currentProduct = null;
        selectedPlan = null;
    }

    tg.MainButton.onClick(() => {
        if (currentProduct && selectedPlan) {
            const finalData = {
                name: `${currentProduct.name} (${selectedPlan.label})`,
                price: selectedPlan.price
            };
            tg.sendData(JSON.stringify(finalData));
            setTimeout(() => { tg.close(); }, 100);
        }
    });

    tg.BackButton.onClick(goBack);
    renderShop();
</script>
</body>
</html>
